<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Treino 3x3"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>3x3 · Treino</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0b0a;--card:#161614;--tx:#f2efe6;--mut:#8d897c;--gold:#d9a93b;--grn:#6fcf5a;--red:#e0645c;--line:#2a2a26;--on:#0b0b0a}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f3ea;--card:#fff;--tx:#1a1a17;--mut:#6d695d;--gold:#a87a10;--grn:#2f8a1f;--red:#c0392b;--line:#ddd8c8;--on:#fff}}
:root[data-theme="light"]{--bg:#f6f3ea;--card:#fff;--tx:#1a1a17;--mut:#6d695d;--gold:#a87a10;--grn:#2f8a1f;--red:#c0392b;--line:#ddd8c8;--on:#fff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:13px;letter-spacing:.2em;color:var(--mut);margin:4px 0 12px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.dn{border-color:var(--grn);background:color-mix(in srgb,var(--grn) 10%,var(--card))}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:8px}
.row:last-child{border:0}
.lab{color:var(--mut);font-size:12px;letter-spacing:.08em}
.n{font-size:34px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.btn{width:100%;padding:16px;border-radius:12px;border:0;background:var(--gold);color:var(--on);font-size:17px;font-weight:800;margin-top:6px}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--line)}
.sm{font-size:13px;color:var(--mut);line-height:1.5}
.tm{font-size:84px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;width:0;background:var(--grn)}
.c{text-align:center}.big{font-size:56px;font-weight:800;color:var(--gold)}
.st{display:flex;gap:8px;justify-content:center;align-items:center;margin:10px 0}
.st button,.nv{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:22px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 3px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left}th{color:var(--mut);font-weight:600;font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--mut);font-size:12px;font-weight:700}
.tabs .on,.cp.on{background:var(--gold);color:var(--on);border-color:var(--gold)}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.g7 span{font-size:11px;color:var(--mut);text-align:center}
.d{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;border:1px solid transparent}
.d small{font-size:9px;opacity:.85}
.d.fut{border-color:var(--gold);color:var(--gold)}.d.done{background:var(--grn);color:var(--on);font-weight:700}
.d.part{background:var(--gold);color:var(--on);font-weight:700}.d.miss{border-color:var(--red);color:var(--red)}
.d.x{background:var(--line)}.d.t{outline:2px solid var(--tx)}.d.sel{box-shadow:0 0 0 3px var(--mut)}
.cal{display:flex;justify-content:space-between;align-items:center}
.wk{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);gap:6px}
.cp{font-size:12px;padding:6px 8px;border-radius:8px;border:1px solid var(--gold);background:none;color:var(--gold);margin:2px}
.cp.done{background:var(--grn);border-color:var(--grn);color:var(--on)}.cp.part{background:var(--gold);color:var(--on)}.cp.miss{border-color:var(--red);color:var(--red)}
.ti{width:92px;text-align:center;font-size:22px;font-weight:700;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px;font-variant-numeric:tabular-nums}
.ng{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.ng button{padding:13px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;font-weight:700}
.rg{display:grid;gap:4px;align-items:center;font-size:12px}
.ck{display:flex;gap:4px;align-items:center;padding:7px 5px;border:1px solid var(--line);border-radius:8px}
.ck.ok{background:color-mix(in srgb,var(--grn) 25%,var(--card));border-color:var(--grn)}
.ck input{width:18px;height:18px;flex:none}
.tabs button{font-size:11px;line-height:1.2}
:root[data-pal="oliva"]{--bg:#0d0f0a;--card:#171a12;--tx:#e6e4d0;--mut:#8b8f78;--gold:#b5a642;--grn:#7fa650;--red:#c0553f;--line:#2b3022;--on:#0d0f0a}
:root[data-pal="coyote"]{--bg:#14110d;--card:#1f1a14;--tx:#ece3d2;--mut:#9a8e78;--gold:#c8a46a;--grn:#8aa05a;--red:#c25b45;--line:#352d22;--on:#14110d}
:root[data-pal="grafite"]{--bg:#0f1113;--card:#181b1e;--tx:#dfe3e6;--mut:#81898f;--gold:#8fa3ad;--grn:#6f9f7a;--red:#c75a52;--line:#2a2f33;--on:#0f1113}
:root[data-pal="marinha"]{--bg:#080d14;--card:#101826;--tx:#dde6f0;--mut:#7d8ea3;--gold:#c9a24b;--grn:#5fa38a;--red:#cc5a52;--line:#1f2d42;--on:#080d14}

:root[data-pal="verdeneg"]{--bg:#000;--card:#0d100a;--tx:#e6e4d0;--mut:#8b8f78;--gold:#7f9c4a;--grn:#a8d672;--red:#c0553f;--line:#252a1c;--on:#000}
:root[data-pal="caquineg"]{--bg:#000;--card:#0f0f0b;--tx:#ece6d0;--mut:#928d78;--gold:#c3b080;--grn:#9fbf6a;--red:#c0553f;--line:#2a281d;--on:#000}
:root[data-pal="woodland"]{--bg:#0c0e09;--card:#10130c;--tx:#e8e6d2;--mut:#9a9c82;--gold:#c3b080;--grn:#9fbf6a;--red:#c8553f;--line:#2e3322;--on:#0c0e09;background-color:#0c0e09;background-size:340px 300px;background-attachment:fixed;background-image:radial-gradient(ellipse 120px 80px at 15% 20%,#1b2515 0 60%,transparent 61%),radial-gradient(ellipse 160px 100px at 70% 15%,#252d1b 0 60%,transparent 61%),radial-gradient(ellipse 140px 90px at 40% 60%,#141a0f 0 60%,transparent 61%),radial-gradient(ellipse 180px 110px at 85% 70%,#2b2518 0 60%,transparent 61%),radial-gradient(ellipse 120px 70px at 10% 85%,#232b1a 0 60%,transparent 61%)}
:root[data-pal="woodland"] body{background:transparent}
.in{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px}
*{-webkit-tap-highlight-color:transparent}button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
</style></head><body><main id="app"></main>
<script>
const app=document.getElementById('app'),$=id=>document.getElementById(id);
const RD=[20,19,18,17,16,15,13,12,11,10],IV=[105,105,120,120,135,135,165,180,195,210];
const NM=['BARRA FIXA','FLEXÃO','AGACHAMENTO'],DN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const LB={done:'concluído',part:'parcial',miss:'perdido',fut:'previsto'},LV=[1,2,3,4,5,6,6,7,7,8,8,9,10],SAT0='2027-01-02';
const cfg=l=>({n:l,r:[l,2*l,3*l],rounds:RD[l-1],iv:IV[l-1],tot:6*l*RD[l-1]});
const pad=n=>String(n).padStart(2,'0');
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+pad(s%60)};
const fmtT=s=>{s=Math.round(s||0);return pad(Math.floor(s/60))+':'+pad(s%60)};
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dt=id=>new Date(id+'T12:00:00');
const fd=id=>{const d=dt(id);return DN[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const s3=a=>a.reduce((x,y)=>x+y,0);
const tot=hs=>{const r=[0,0,0];hs.forEach(h=>h.reps.forEach((v,i)=>r[i]+=v));return r};
const isSat=id=>id>=SAT0&&dt(id).getDay()==6;
const RN=['Corrida 1 (1 milha)','Corrida 2 (1 milha)'];
const MU=(l,n,a,b,c)=>({l,rd:n,mv:[['Pull-ups',a,0],['Push-ups',b,1],['Air squats',c,2]],runs:RN});
const WODS=[
{id:'murph',n:'Murph Test',d:'Corrida de 1 milha, 100 pull-ups, 200 push-ups, 300 air squats e corrida de 1 milha. Colete opcional (9 kg / 20 lb).',f:[{l:'Sequencial 100/200/300',seq:[['Pull-ups',100,0],['Push-ups',200,1],['Air squats',300,2]],runs:RN},MU('20 rodadas · 5/10/15',20,5,10,15),MU('10 rodadas · 10/20/30',10,10,20,30),MU('5 rodadas · 20/40/60',5,20,40,60),MU('4 rodadas · 25/50/75',4,25,50,75)]},
{id:'chad',n:'Chad',d:'1.000 step-ups em caixa de 20 pol. (50 cm), com mochila de 45 lb (20 kg), por tempo.',f:[{l:'10 rodadas · 100 step-ups',rd:10,mv:[['Step-ups',100,-1]]},{l:'Sequencial · 1.000 step-ups',seq:[['Step-ups',1000,-1]]}]},
{id:'eva',n:'Eva',d:'5 rodadas por tempo.',f:[{l:'5 rodadas',rd:5,mv:[['Corrida 800 m',0,-1],['KB swings 70 lb',30,-1],['Pull-ups',30,0]]}]},
{id:'seven',n:'Seven',d:'7 rodadas por tempo, 7 repetições de cada movimento.',f:[{l:'7 rodadas',rd:7,mv:[['HSPU',7,-1],['Thrusters 135 lb',7,-1],['Knees-to-elbows',7,-1],['Deadlifts 245 lb',7,-1],['Burpees',7,-1],['KB swings 70 lb',7,-1],['Pull-ups',7,0]]}]},
{id:'barbara',n:'Barbara',d:'5 rodadas por tempo, com 3 min de descanso entre as rodadas.',f:[{l:'5 rodadas',rd:5,mv:[['Pull-ups',20,0],['Push-ups',30,1],['Sit-ups',40,-1],['Air squats',50,2]]}]},
{id:'nancy',n:'Nancy',d:'5 rodadas por tempo.',f:[{l:'5 rodadas',rd:5,mv:[['Corrida 400 m',0,-1],['Overhead squats 95 lb',15,-1]]}]},
{id:'angie',n:'Angie',d:'Por tempo: complete cada movimento antes de passar ao próximo.',f:[{l:'Sequencial 100×4',seq:[['Pull-ups',100,0],['Push-ups',100,1],['Sit-ups',100,-1],['Air squats',100,2]]}]},
{id:'nicole',n:'Nicole',d:'AMRAP 20 min: corrida de 400 m + máximo de pull-ups por rodada.',f:[{l:'AMRAP 20 min',am:1}]},
{id:'atalanta',n:'Atalanta',d:'Corrida, HSPU, single-leg squats, pull-ups e corrida, com colete (14 lb mulheres / 20 lb homens).',f:[{l:'Atalanta completa',seq:[['HSPU',100,-1],['Single-leg squats',200,-1],['Pull-ups',300,0]],runs:RN},{l:'1/2 Atalanta',seq:[['HSPU',50,-1],['Single-leg squats',100,-1],['Pull-ups',150,0]],runs:['Corrida 1','Corrida 2']}]},
{id:'dt',n:'DT',d:'5 rodadas por tempo, com barra de 155 lb (70 kg). Mulheres: 105 lb (48 kg).',f:[{l:'5 rodadas',rd:5,mv:[['Deadlifts 155 lb',12,-1],['Hang power cleans',9,-1],['Push jerks',6,-1]]}]},
{id:'daniel',n:'Daniel',d:'Por tempo. Thrusters com 95 lb (43 kg); mulheres 65 lb. Nas corridas, toque em 1 ao concluir.',f:[{l:'Sequencial',seq:[['Pull-ups',50,0],['Corrida 400 m',1,-1],['Thrusters 95 lb',21,-1],['Corrida 800 m',1,-1],['Thrusters 95 lb',21,-1],['Corrida 400 m',1,-1],['Pull-ups',50,0]]}]},
{id:'loredo',n:'Loredo',d:'6 rodadas por tempo, só peso do corpo.',f:[{l:'6 rodadas',rd:6,mv:[['Air squats',24,2],['Push-ups',24,1],['Walking lunges',24,-1],['Corrida 400 m',0,-1]]}]},
{id:'bulger',n:'Bulger',d:'10 rodadas por tempo. Front squat com 135 lb (61 kg); mulheres 95 lb.',f:[{l:'10 rodadas',rd:10,mv:[['Corrida 150 m',0,-1],['Chest-to-bar',7,0],['Front squats 135 lb',7,-1],['HSPU',7,-1]]}]},
{id:'badger',n:'Badger',d:'3 rodadas por tempo. Squat clean com 95 lb (43 kg); mulheres 65 lb.',f:[{l:'3 rodadas',rd:3,mv:[['Squat cleans 95 lb',30,-1],['Pull-ups',30,0],['Corrida 800 m',0,-1]]}]},
{id:'michael',n:'Michael',d:'3 rodadas por tempo, com pouco equipamento.',f:[{l:'3 rodadas',rd:3,mv:[['Corrida 800 m',0,-1],['Back extensions',50,-1],['Sit-ups',50,-1]]}]},
{id:'josh',n:'Josh',d:'Por tempo, escada decrescente. Overhead squat com 95 lb (43 kg); mulheres 65 lb.',f:[{l:'Sequencial',seq:[['Overhead squats 95 lb',21,-1],['Pull-ups',42,0],['Overhead squats',15,-1],['Pull-ups',30,0],['Overhead squats',9,-1],['Pull-ups',18,0]]}]},
{id:'roy',n:'Roy',d:'5 rodadas por tempo. Deadlift 225 lb (102 kg) e caixa de 24 pol. (60 cm); mulheres 155 lb e 20 pol.',f:[{l:'5 rodadas',rd:5,mv:[['Deadlifts 225 lb',15,-1],['Box jumps 24 pol.',20,-1],['Pull-ups',25,0]]}]}
];
const WD=id=>WODS.find(w=>w.id==id);
let S={start:'2026-10-05',hist:[]},W=null,A=null,WL=null,P=[],T='',sel=null,M=null,tab='t',cs=null,ws=null,wf=0;
try{const x=localStorage.getItem('t3');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem('t3',JSON.stringify(S))}catch(e){}};
if(!S.v){S.v=2;S.start='2026-10-05';if(!S.hist.some(h=>h.p==='2026-10-05'))S.hist.push({d:new Date('2026-10-05T12:00:00').getTime(),p:'2026-10-05',l:1,done:20,rounds:20,reps:[20,40,60],sec:2100});save()}
function plan(){const s=dt(S.start),o=[];LV.forEach((l,w)=>(l<=6?[0,2,4]:[1,3]).forEach(k=>{const d=new Date(s);d.setDate(s.getDate()+w*7+k);o.push({id:iso(d),w:w+1,l})}));return o}
function st(id){const r=S.hist.filter(h=>h.p===id);if(r.some(h=>h.done==h.rounds))return'done';if(r.length)return'part';return id<T?'miss':'fut'}
const recs=id=>S.hist.filter(h=>iso(new Date(h.d))==id);
function beep(f,d){try{const o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n||200)}catch(e){}}
function pick(id){sel=id;tab='t';home();scrollTo(0,0)}
function mv(n){M.m+=n;if(M.m<0){M.m=11;M.y--}if(M.m>11){M.m=0;M.y++}home()}
const nav=()=>`<div class="tabs">${[['t','Treino 3×3'],['w','Meet Yourself Saturday'],['h','Hábitos'],['c','Calendário'],['a','Ajustes']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';home()">${l}</button>`).join('')}</div>`;
function home(){
 P=plan();T=iso(new Date());
 if(!M){const b=dt(T<S.start?S.start:T);M={y:b.getFullYear(),m:b.getMonth()}}
 app.innerHTML='<h1>3×3 · NO GYM PROTOCOL</h1>'+nav()+'<div id="rb">'+rbH()+'</div>'+(tab=='t'?vT():tab=='w'?vW():tab=='h'?vH():tab=='c'?vC():vA());
}
function vT(){
 const cur=P.find(p=>p.id>=T&&st(p.id)!='done');
 if(!sel||!P.find(p=>p.id==sel))sel=cur?cur.id:null;
 const sp=P.find(p=>p.id==sel),c=sp&&cfg(sp.l),s=sp&&st(sel),rc=sp&&S.hist.filter(h=>h.p===sel&&h.done==h.rounds).pop();
 const hj=tot(S.hist.filter(h=>iso(new Date(h.d))==T)),gr=tot(S.hist);
 const nd=P.filter(p=>st(p.id)=='done').length,pr=P.reduce((a,p)=>a+cfg(p.l).tot,0),g3=s3(tot(S.hist.filter(h=>h.k!='w')));
 const row=r=>`<td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><b>${s3(r)}</b></td>`;
 const card=sp?`<div class="card${s=='done'?' dn':''}"><div class="lab">${sel==T?'HOJE':'TREINO SELECIONADO'} · ${fd(sel).toUpperCase()}</div>
  <div style="font-weight:700;margin:4px 0 6px">Semana ${sp.w} · Nível ${sp.l} <span class="sm">(${LB[s]})</span></div>
  ${c.r.map((v,i)=>`<div class="row"><span class="lab">${NM[i]}</span><span class="n">${v}</span></div>`).join('')}
  <div class="sm" style="margin-top:6px">A cada <b>${fmt(c.iv)}</b>, faça as 3 séries em sequência e descanse até o próximo ciclo. ${c.rounds} rodadas · ${c.tot} reps · ~${Math.round(c.rounds*c.iv/60)} min.</div>
  ${s=='done'?`<div class="sm" style="margin-top:8px;color:var(--grn)">✓ Concluído em ${new Date(rc.d).toLocaleDateString('pt-BR')} · duração ${fmtT(rc.sec)}. Treino concluído fica só para consulta.</div>`:`<button class="btn" onclick="start()">${s=='part'?'REFAZER TREINO':'INICIAR TREINO'}</button>`}</div>`
  :`<div class="card sm">Nenhum treino previsto a partir de hoje. Toque em um dia do calendário para ver ou fazer um treino.</div>`;
 const wk=LV.map((l,i)=>`<div class="wk"><span class="lab">SEM ${i+1} · N${l}</span><span>${P.filter(p=>p.w==i+1).map(p=>`<button class="cp ${st(p.id)}" onclick="pick('${p.id}')">${fd(p.id).slice(0,6)}</button>`).join('')}</span></div>`).join('');
 return nag()+card+`<div class="card"><div class="lab" style="margin-bottom:4px">REPETIÇÕES (3×3 + SÁBADOS)</div><table><tr><th></th><th>Barra</th><th>Flex.</th><th>Agach.</th><th>Total</th></tr><tr><td>Hoje</td>${row(hj)}</tr><tr><td>Geral</td>${row(gr)}</tr></table>
 <div class="sm" style="margin-top:8px">${nd}/${P.length} treinos 3×3 concluídos · ${g3} de ${pr} reps do 3×3</div></div>
 <div class="card"><div class="lab" style="margin-bottom:4px">PREVISÃO · 13 SEMANAS</div>${wk}</div>`;
}
const det=h=>h.k=='w'?`<div style="margin:8px 0"><b>${h.n}</b> · ${h.f}<div class="sm">Tempo total ${fmtT(h.tm.tot)}${h.tm.r1?' · Corrida 1: '+fmtT(h.tm.r1):''}${h.tm.r2?' · Corrida 2: '+fmtT(h.tm.r2):''}<br>${h.dn}<br>Barra ${h.reps[0]} · Flexão ${h.reps[1]} · Agach. ${h.reps[2]}</div></div>`
 :`<div style="margin:8px 0"><b>Treino 3×3 · Nível ${h.l}</b><div class="sm">${h.done}/${h.rounds} rodadas · duração ${fmtT(h.sec)}<br>Barra ${h.reps[0]} · Flexão ${h.reps[1]} · Agach. ${h.reps[2]}</div></div>`;
function vC(){
 if(!cs)cs=T;
 const first=new Date(M.y,M.m,1),pd=(first.getDay()+6)%7,dim=new Date(M.y,M.m+1,0).getDate();
 let g='';for(let i=0;i<pd;i++)g+='<i></i>';
 for(let d=1;d<=dim;d++){const id=M.y+'-'+pad(M.m+1)+'-'+pad(d),p=P.find(x=>x.id==id),w=isSat(id),rs=recs(id);
  const k=p?st(id):w?(rs.some(h=>h.k=='w')?'done':id<T?'miss':'fut'):rs.length?'x':'';
  g+=`<div class="d ${k}${id==T?' t':''}${id==cs?' sel':''}" onclick="cs='${id}';home()">${d}${p?`<small>N${p.l}</small>`:w?'<small>★</small>':''}</div>`}
 const rs=recs(cs),p=P.find(x=>x.id==cs);
 return `<div class="card"><div class="cal"><button class="nv" onclick="mv(-1)">‹</button><b>${first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button class="nv" onclick="mv(1)">›</button></div>
 <div class="g7">${['S','T','Q','Q','S','S','D'].map(x=>`<span>${x}</span>`).join('')}${g}</div>
 <div class="sm" style="margin-top:8px">N = nível do 3×3 · ★ = Meet Yourself Saturday. Verde: concluído · Dourado cheio: parcial · Contorno dourado: previsto · Vermelho: perdido · Cinza: treino extra.</div></div>
 <div class="card"><div class="lab">${fd(cs).toUpperCase()}</div>${rs.length?rs.map(det).join(''):'<div class="sm" style="margin-top:6px">Nenhum treino registrado nesta data.</div>'}
