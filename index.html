 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();return'link'}catch(e){return'fail'}}

function x5pl(w){let s=(w-X5B)/2;if(s<=0)return'só a barra';const o=[];X5P.forEach(p=>{while(s>=p-1e-9){o.push(p);s-=p}});return o.join(' + ')+' por lado'}

function x5fin(){const f=S.f,c=f.cur,msg=[];const L=[];
 c.l.forEach(l=>{const done=l.s.some(v=>v!=null);L.push({k:l.k,w:l.w,s:l.s.map(v=>v==null?0:v)});if(!done)return;

 f.log.push({id:c.id,d:Date.now(),t:c.t,l:L,a:c.a.filter(a=>a.s.some(v=>v!=null)).map(a=>({id:a.id,w:a.w,s:a.s.map(v=>v==null?0:v)}))});
 f.nx=c.t=='A'?'B':'A';f.cur=null;X5R=null;x5cf=0;x5m=msg.join(' · ');save();home()}
